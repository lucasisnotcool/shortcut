<!doctype html><html><head><meta charset=utf-8><title>Ranking</title><style>
body{font:17px -apple-system,system-ui,sans-serif;background:#f4f5f7;color:#1d1d1f;margin:0;padding:28px 36px}
.bar{font-size:13px;color:#6e6e73;margin-bottom:14px;letter-spacing:.02em}
.card{background:#fff;border-radius:14px;padding:22px 26px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:18px}
h2{font-size:14px;color:#6e6e73;margin:0 0 6px;font-weight:600}
.q{font-size:20px;font-weight:600;margin:0 0 16px;line-height:1.35}
.opt{display:flex;align-items:center;gap:12px;border:1px solid #d2d2d7;border-radius:10px;padding:10px 14px;margin:8px 0}
.lab{font-weight:700;width:22px;color:#3a3a3c}
.box{width:16px;height:16px;border:1.5px solid #8e8e93;border-radius:4px}
.radio{width:16px;height:16px;border:1.5px solid #8e8e93;border-radius:50%}
.done{background:#eef8f0;border-color:#9fd3ab}
.fb{color:#1f7a3a;font-weight:600;margin-top:10px}
.blank{display:inline-block;min-width:130px;border-bottom:2px solid #1d1d1f;margin:0 4px}
.dd{display:inline-block;position:relative;border:1px solid #0a64d8;border-radius:6px;padding:2px 26px 2px 10px;color:#6e6e73}
.list{position:absolute;left:0;top:34px;background:#fff;border:1px solid #d2d2d7;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.15);width:190px;padding:4px 0;color:#1d1d1f;font-weight:400}
.list div{padding:6px 12px}
.list div:hover{background:#eef}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px}
.drag{display:flex;align-items:center;gap:12px;border:1px solid #d2d2d7;border-radius:10px;padding:9px 14px;margin:7px 0;background:#fafafa}
.handle{color:#aeaeb2}
.input{border:1px solid #d2d2d7;border-radius:8px;padding:8px 12px;width:180px;color:#aeaeb2;margin-top:6px}
.slide{background:#fff;border-radius:14px;padding:40px 48px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.slide h1{margin:0 0 18px;font-size:34px}
.slide li{margin:10px 0;font-size:21px}
</style></head><body><div class=bar>DEMO COURSE · WEEKLY QUIZ (mock content)</div><div class=card><h2>Question 5 · Drag to reorder</h2><p class=q>Arrange these levels of organisation from smallest to largest.</p><div class=drag><span class=handle>☰</span><span class=lab>1</span>Cell</div><div class=drag><span class=handle>☰</span><span class=lab>2</span>Atom</div><div class=drag><span class=handle>☰</span><span class=lab>3</span>Organ</div><div class=drag><span class=handle>☰</span><span class=lab>4</span>Molecule</div><div class=drag><span class=handle>☰</span><span class=lab>5</span>Tissue</div></div></body></html>
